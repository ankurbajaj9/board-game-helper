[project]
name = "board-game-rules"
version = "0.1.0"
description = "Local, cited board game rules answers using Docling, Qdrant, and Gemma 4"
requires-python = ">=3.14,<3.15"
dependencies = [
    "docling>=2",
    "fastembed>=0.7",
    "httpx>=0.28",
    "pydantic-settings>=2",
    "prefect>=3",
    "qdrant-client>=1.16",
    "streamlit>=1.66",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
board-game-rules = "board_game_rules.interfaces.cli:main"
board-game-rules-ui = "board_game_rules.interfaces.ui:launch"
board-game-rules-watch = "board_game_rules.interfaces.watcher:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "ty>=0.0.1"]

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
